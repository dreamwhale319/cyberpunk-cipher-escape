<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사이버 암호 탈출</title><style>:root{color-scheme:dark;--bg:#070912;--panel:rgba(13,18,34,.88);--panel2:rgba(18,26,48,.96);--line:rgba(102,252,241,.34);--hot:rgba(255,46,136,.58);--text:#edf7ff;--muted:#8da0b8;--dim:#61708a;--cyan:#66fcf1;--pink:#ff2e88;--lime:#b7ff39;--amber:#ffd166;--bad:#ff5a6a;--mono:"D2Coding","Consolas",monospace;--sans:"Pretendard","Malgun Gothic",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--text);font-family:var(--sans);line-height:1.55;background:linear-gradient(90deg,rgba(102,252,241,.05) 1px,transparent 1px),linear-gradient(0deg,rgba(255,46,136,.04) 1px,transparent 1px),radial-gradient(circle at 16% 18%,rgba(102,252,241,.14),transparent 28%),radial-gradient(circle at 84% 12%,rgba(255,46,136,.12),transparent 25%),linear-gradient(135deg,#070912,#101827 45%,#090b13);background-size:48px 48px,48px 48px,auto,auto,auto;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 7px);mix-blend-mode:overlay;opacity:.36}.lock-screen{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}.lock-screen.is-hidden{display:none}.lock-frame{position:relative;width:min(960px,100%);aspect-ratio:16/9;border:1px solid rgba(102,252,241,.36);background:#001709;box-shadow:0 0 34px rgba(0,255,112,.25),0 0 80px rgba(102,252,241,.14);overflow:hidden}.lock-frame img{display:block;width:100%;height:100%;object-fit:cover}.lock-button{position:absolute;left:50%;top:42%;width:min(29%,250px);aspect-ratio:1/1;min-height:0;padding:0;border:1px solid transparent;background:rgba(0,255,112,.01);transform:translate(-50%,-50%);border-radius:22px}.lock-button:hover,.lock-button:focus-visible{border-color:rgba(102,252,241,.9);background:rgba(102,252,241,.08);box-shadow:0 0 24px rgba(102,252,241,.48),inset 0 0 20px rgba(0,255,112,.14);outline:0}.app{width:min(1120px,calc(100% - 32px));min-height:100vh;margin:0 auto;padding:32px 0 44px;display:none;grid-template-rows:auto 1fr;gap:20px}.app.is-running{display:grid}.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding:18px 0 8px}.eyebrow{margin:0 0 8px;color:var(--cyan);font-family:var(--mono);font-size:12px;text-transform:uppercase;text-shadow:0 0 22px rgba(102,252,241,.24)}h1{margin:0;font-size:clamp(32px,5vw,68px);line-height:1;text-shadow:0 0 18px rgba(102,252,241,.32),2px 0 0 rgba(255,46,136,.46)}.status{min-width:216px;padding:14px 16px;background:rgba(7,9,18,.72);border:1px solid var(--line);box-shadow:0 0 22px rgba(102,252,241,.24)}.status-row{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:13px}.status strong{color:var(--text);font-family:var(--mono);font-size:16px}.progress{height:10px;margin-top:12px;overflow:hidden;border:1px solid rgba(102,252,241,.24);background:rgba(255,255,255,.05)}.progress>span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lime));transition:width .24s}.shell{display:grid;grid-template-columns:84px minmax(0,1fr);gap:18px}.rail{display:grid;grid-template-rows:repeat(10,minmax(34px,1fr));gap:8px}.node{min-height:34px;border:1px solid rgba(141,160,184,.24);color:var(--dim);background:rgba(7,9,18,.52);font-family:var(--mono);font-size:13px;display:grid;place-items:center}.node.active{color:var(--bg);background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 22px rgba(102,252,241,.24)}.node.done{color:var(--bg);background:var(--lime);border-color:var(--lime)}.panel{min-height:min(620px,calc(100vh - 190px));position:relative;padding:clamp(20px,4vw,44px);background:linear-gradient(180deg,rgba(255,255,255,.055),transparent 38%),var(--panel);border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,46,136,.12),0 26px 80px rgba(0,0,0,.38),0 0 22px rgba(102,252,241,.24);overflow:hidden}.panel:after{content:"";position:absolute;inset:16px;border-top:1px solid var(--hot);border-right:1px solid rgba(255,209,102,.34);pointer-events:none}.stage-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:28px;font-family:var(--mono);color:var(--muted);font-size:13px}.stage-meta span{border:1px solid rgba(102,252,241,.32);padding:6px 10px;background:rgba(7,9,18,.44)}.stage-meta .live{color:var(--pink);border-color:var(--hot);text-shadow:0 0 24px rgba(255,46,136,.22)}.stage-title{margin:0 0 26px;font-size:clamp(24px,3.4vw,42px);line-height:1.18}.problem-label{margin:0 0 8px;color:var(--amber);font-family:var(--mono);font-size:13px}.cipher{width:100%;min-height:136px;display:grid;place-items:center;padding:clamp(18px,4vw,36px);background:linear-gradient(90deg,rgba(102,252,241,.08),rgba(255,46,136,.08)),var(--panel2);border:1px solid rgba(255,255,255,.12);color:#fff;font-family:var(--mono);font-size:clamp(25px,5vw,54px);line-height:1.35;text-align:center;word-break:break-word;text-shadow:0 0 18px rgba(102,252,241,.44),2px 0 0 rgba(255,46,136,.36)}.quiz{display:grid;gap:12px;margin-top:18px}.quiz-question{margin:0 0 8px;color:var(--text);font-size:clamp(19px,2.8vw,28px);line-height:1.45}.answer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-top:28px}input{width:100%;height:52px;border:1px solid rgba(102,252,241,.36);background:rgba(1,3,9,.74);color:var(--text);padding:0 16px;font-family:var(--mono);font-size:18px;outline:0;box-shadow:inset 0 0 18px rgba(102,252,241,.08)}input:focus{border-color:var(--pink);box-shadow:inset 0 0 18px rgba(255,46,136,.12),0 0 24px rgba(255,46,136,.22)}button{min-height:52px;border:1px solid rgba(102,252,241,.56);background:rgba(102,252,241,.12);color:var(--text);padding:0 18px;font-family:var(--mono);font-size:15px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}button:hover{border-color:var(--pink);background:rgba(255,46,136,.16)}button:active{transform:translateY(1px)}button:disabled,input:disabled{cursor:not-allowed;opacity:.56}.quiz button{width:100%;text-align:left;padding:14px 16px}.message{min-height:24px;margin-top:14px;color:var(--muted);font-weight:700}.message.ok{color:var(--lime)}.message.no{color:var(--bad)}.final{display:none;min-height:min(620px,calc(100vh - 190px));padding:clamp(24px,5vw,54px);border:1px solid var(--line);background:linear-gradient(135deg,rgba(183,255,57,.08),rgba(102,252,241,.08) 42%,rgba(255,46,136,.08)),var(--panel);box-shadow:0 0 22px rgba(102,252,241,.24),0 0 24px rgba(255,46,136,.22)}.final.show{display:grid;align-content:center;gap:20px}.final h2{margin:0;font-size:clamp(34px,6vw,72px);line-height:1;color:var(--lime);text-shadow:0 0 22px rgba(183,255,57,.32)}.final p{margin:0;color:var(--muted)}.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:4px}.word-grid span{min-height:46px;display:grid;place-items:center;border:1px solid rgba(183,255,57,.35);background:rgba(7,9,18,.58);color:var(--text);font-family:var(--mono)}@media(max-width:720px){.app{width:min(100% - 24px,1120px);padding-top:18px}.topbar{grid-template-columns:1fr}.status{min-width:0}.shell{grid-template-columns:1fr}.rail{grid-template-columns:repeat(10,minmax(24px,1fr));grid-template-rows:none;gap:5px}.node{min-height:28px;font-size:11px}.panel,.final{min-height:520px}.answer{grid-template-columns:1fr}}</style></head><body><section class="lock-screen" id="lockScreen" aria-label="잠금 화면"><div class="lock-frame"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAA8KCw0LCQ8NDA0REA8RFiUYFhQUFi0gIhslNS84NzQvNDM7QlVIOz9QPzM0SmRLUFdaX2BfOUdob2dcblVdX1v/2wBDARARERYTFisYGCtbPTQ9W1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1v/wAARCAEOAeADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhc dChild(p);s.options.forEach(o=>{const b=document.createElement("button");b.type="button";b.textContent=o;b.addEventListener("click",()=>checkQuiz(o));q.appendChild(b)});answerArea.appendChild(q)}else{const f=document.createElement("form");f.className="answer";f.innerHTML='<input id="answerInput" type="text" autocomplete="off" placeholder="해독 결과 입력" aria-label="해독 결과"><button type="submit">전송</button>';f.addEventListener("submit",e=>{e.preventDefault();checkText()});answerArea.appendChild(f);document.getElementById("answerInput").focus()}updateProgress()}function updateProgress(){const c=solved.filter(Boolean).length;count.textContent=c;progressFill.style.width=`${c*10}%`;[...rail.children].forEach((n,i)=>{n.className="node";if(solved[i])n.classList.add("done");if(i===current&&!solved[i])n.classList.add("active")})}function markSolved(){solved[current]=true;updateProgress();message.className="message ok";message.textContent="게이트 해제 완료";setTimeout(()=>{if(current===STAGES.length-1){finish();return}current++;renderStage()},420)}function checkText(){const s=STAGES[current],input=document.getElementById("answerInput");if(normalize(input.value)===normalize(s.answer)){input.disabled=true;answerArea.querySelector("button").disabled=true;markSolved();return}message.className="message no";message.textContent="일치하지 않습니다"}function checkQuiz(o){const s=STAGES[current];if(normalize(o)===normalize(s.answer)){answerArea.querySelectorAll("button").forEach(b=>b.disabled=true);markSolved();return}message.className="message no";message.textContent="일치하지 않습니다"}function finish(){clearInterval(timerId);gamePanel.style.display="none";finalPanel.classList.add("show");finalTime.textContent=formatTime(Date.now()-startedAt);finalWordBox.innerHTML="";finalWords.forEach(w=>{const i=document.createElement("span");i.textContent=w;finalWordBox.appendChild(i)})}function restart(){current=0;solved=new Array(STAGES.length).fill(false);startedAt=Date.now();gamePanel.style.display="";finalPanel.classList.remove("show");clearInterval(timerId);timerId=setInterval(tick,1000);tick();renderStage()}function startGame(){lockScreen.classList.add("is-hidden");app.classList.add("is-running");restart()}document.getElementById("restartButton").addEventListener("click",restart);document.getElementById("lockButton").addEventListener("click",startGame);buildRail();</script></body></html>
